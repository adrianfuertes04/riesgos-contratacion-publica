[project]
name = "prueba-proyecto"
version = "0.1.0"
description = "TFM: análisis visual y detección de riesgos en la contratación pública española"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "lxml>=6.1.3",
    "neo4j>=6.4.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pymongo>=4.19.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261006",
]

[tool.uv]
# Proyecto de aplicación: los paquetes se importan desde la raíz (pipelines, api).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes y signos tipográficos

[tool.ruff.lint.per-file-ignores]
"pipelines/indicators/build_gold.py" = ["E501"]  # SQL legible en una línea por expresión

[tool.mypy]
python_version = "3.12"
packages = ["pipelines", "api"]
ignore_missing_imports = true
warn_unused_ignores = true
